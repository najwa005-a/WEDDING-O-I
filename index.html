<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omaima & Driss — Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5eee5;
    color:#80613c;
    font-family:'Cormorant Garamond',serif;
    overflow-x:hidden;
}

a{
    -webkit-tap-highlight-color:transparent;
}

/* =====================================================
   INTRO
===================================================== */

.intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #fffaf4 0%,
            #f4e8da 55%,
            #e8d8c5 100%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.envelope{
    width:min(88vw,420px);
    height:570px;

    position:relative;
    cursor:pointer;

    animation:envelopeAppear 1.3s ease both;
}

@keyframes envelopeAppear{

    from{
        opacity:0;
        transform:translateY(30px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.paper{
    position:absolute;
    inset:0;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #fffaf5,
            #f6eade
        );

    border:1px solid rgba(165,125,72,.25);

    box-shadow:
        0 30px 80px rgba(84,55,27,.20),
        inset 0 0 60px rgba(173,130,77,.07);
}


/* =====================================================
   FLORAL DECORATION
===================================================== */

.flower{
    position:absolute;
    color:#bd9a68;
    opacity:.38;
    font-size:54px;
    line-height:1;

    filter:drop-shadow(
        0 2px 2px rgba(125,88,43,.08)
    );
}

.flower::before{
    content:"❦";
}

.f1{
    top:20px;
    left:50%;
    transform:
        translateX(-50%)
        rotate(180deg);
}

.f2{
    left:20px;
    top:150px;
    transform:rotate(-35deg);
}

.f3{
    right:20px;
    top:150px;
    transform:rotate(35deg);
}

.f4{
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
}


/* =====================================================
   ORNAMENT LINES
===================================================== */

.ornament{
    position:absolute;

    width:1px;
    height:130px;

    background:
        linear-gradient(
            transparent,
            #b89563,
            transparent
        );

    opacity:.4;
}

.o1{
    left:55px;
    top:175px;
    transform:rotate(22deg);
}

.o2{
    right:55px;
    top:175px;
    transform:rotate(-22deg);
}


/* =====================================================
   INTRO CONTENT
===================================================== */

.invitation{
    position:absolute;
    inset:0;

    padding:
        145px
        30px
        30px;

    text-align:center;
}

.small-title{
    font-family:'Playfair Display',serif;
    letter-spacing:4px;
    font-size:10px;
    color:#a17c48;
    margin-bottom:15px;
}

.names{
    font-family:'Great Vibes',cursive;
    font-size:52px;
    line-height:1;
    color:#986f3a;
}

.and{
    font-family:'Playfair Display',serif;
    font-size:20px;
    margin:7px 0;
    color:#b08a54;
}

.intro-date{
    margin-top:24px;

    font-family:'Playfair Display',serif;
    font-size:12px;
    letter-spacing:2px;
    color:#87653b;
}

.intro-place{
    margin-top:9px;
    font-size:14px;
    letter-spacing:2px;
    color:#9b784d;
}


/* =====================================================
   SEAL
===================================================== */

.seal{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:94px;
    height:94px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffaf4 0 53%,
            #e2ceb5 54% 61%,
            #fffaf4 62%
        );

    box-shadow:
        0 8px 30px rgba(101,70,34,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:5;
}

.seal span{
    font-family:'Great Vibes',cursive;
    font-size:35px;
    color:#a3783e;
}


/* =====================================================
   OPEN TEXT
===================================================== */

.open-text{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;

    text-align:center;

    font-size:11px;
    letter-spacing:3px;
    color:#a3865c;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }
}


/* =====================================================
   MAIN WEBSITE
===================================================== */

.website{
    opacity:0;
    visibility:hidden;

    transition:
        opacity 1.3s ease;
}

.website.show{
    opacity:1;
    visibility:visible;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    overflow:hidden;

    background:

        linear-gradient(
            rgba(247,238,227,.72),
            rgba(247,238,227,.91)
        ),

        url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1800&q=90")

        center/cover;
}

.hero::before{
    content:"";

    position:absolute;
    inset:18px;

    border:
        1px solid
        rgba(151,111,60,.3);

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    padding:30px;
}

.hero-small{
    letter-spacing:5px;
    font-size:11px;
    text-transform:uppercase;
    color:#88683f;
}

.hero-names{
    font-family:'Great Vibes',cursive;

    font-size:
        clamp(
            70px,
            15vw,
            125px
        );

    line-height:.9;
    color:#956b35;

    margin:25px 0;
}

.hero-date{
    font-family:'Playfair Display',serif;

    font-size:17px;
    letter-spacing:4px;
    color:#7d5c37;
}

.hero-place{
    margin-top:13px;
    font-size:17px;
    letter-spacing:3px;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider{
    width:90px;
    height:1px;

    background:#b89663;

    margin:28px auto;

    position:relative;
}

.divider::after{
    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:#f7eee5;

    padding:0 10px;

    font-size:13px;
    color:#a37c48;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
    position:fixed;

    z-index:100;

    bottom:20px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(92%,650px);

    display:flex;
    justify-content:space-around;
    align-items:center;

    padding:11px 12px;

    background:
        rgba(255,250,244,.88);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:
        1px solid
        rgba(153,113,61,.2);

    border-radius:50px;

    box-shadow:
        0 12px 35px
        rgba(84,57,28,.13);
}

.nav a{
    color:#80603b;
    text-decoration:none;

    font-size:12px;
    letter-spacing:1px;

    padding:8px 12px;

    transition:.3s ease;
}

.nav a:hover{
    color:#ad8148;
}


/* =====================================================
   SECTIONS
===================================================== */

section{
    padding:
        100px
        20px;

    position:relative;
}

.section-title{
    text-align:center;

    font-family:'Great Vibes',cursive;

    font-size:58px;

    color:#956d39;
}

.section-subtitle{
    text-align:center;

    margin-top:8px;

    font-size:12px;

    letter-spacing:3px;

    text-transform:uppercase;
}


/* =====================================================
   STORY
===================================================== */

.story{
    max-width:850px;

    margin:auto;

    text-align:center;

    font-size:20px;

    line-height:1.8;

    color:#725a3c;
}

.arabic{
    direction:rtl;

    font-family:'Amiri',serif;

    font-size:31px;

    line-height:1.8;

    margin:
        30px
        0
        22px;

    color:#8d6838;
}


/* =====================================================
   DETAILS
===================================================== */

.details{
    background:
        linear-gradient(
            135deg,
            #efe0cf,
            #f4e8dc
        );
}

.cards{
    max-width:1000px;

    margin:
        55px
        auto
        0;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:25px;
}

.card{
    background:
        rgba(255,250,244,.72);

    border:
        1px solid
        rgba(157,116,61,.2);

    padding:
        40px
        20px;

    text-align:center;

    box-shadow:
        0 15px 40px
        rgba(103,74,39,.08);

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}

.card:hover{
    transform:
        translateY(-5px);

    box-shadow:
        0 20px 45px
        rgba(103,74,39,.13);
}

.card-icon{
    font-size:30px;
    color:#a27b44;
    margin-bottom:15px;
}

.card h3{
    font-family:'Playfair Display',serif;

    font-weight:500;

    letter-spacing:2px;

    font-size:16px;

    color:#7e5c36;
}

.card p{
    margin-top:12px;

    font-size:17px;

    line-height:1.6;

    color:#735a3d;
}


/* =====================================================
   MAP BUTTON
===================================================== */

.map-button{
    display:inline-block;

    margin-top:20px;

    padding:
        12px
        22px;

    border:
        1px solid
        #a17b45;

    color:#8b6739;

    text-decoration:none;

    font-size:10px;

    letter-spacing:2px;

    transition:.35s ease;
}

.map-button:hover{
    background:#9b7542;
    color:white;
    transform:translateY(-2px);
}

.map-button:active{
    transform:translateY(-1px);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown{
    display:flex;

    justify-content:center;

    gap:35px;

    margin-top:55px;

    flex-wrap:wrap;
}

.time-box{
    min-width:100px;
    text-align:center;
}

.time-number{
    font-family:'Playfair Display',serif;

    font-size:44px;

    color:#956d38;
}

.time-label{
    font-size:10px;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-top:5px;
}


/* =====================================================
   RSVP
===================================================== */

.rsvp{
    background:#f8f0e7;

    text-align:center;
}

.rsvp-text{
    max-width:700px;

    margin:
        25px
        auto
        35px;

    font-size:19px;

    line-height:1.7;

    color:#725a3c;
}

.rsvp-form{

    width:min(100%,700px);

    margin:0 auto;

    text-align:left;
}

.form-group{
    margin-bottom:25px;
}

.form-label{
    display:block;

    font-size:18px;

    letter-spacing:2px;

    color:#80603d;

    margin-bottom:10px;
}

.form-input,
.form-select,
.form-message{

    width:100%;

    padding:17px 20px;

    background:
        rgba(255,250,244,.65);

    border:
        1px solid
        rgba(157,116,61,.35);

    color:#705638;

    font-family:'Cormorant Garamond',serif;

    font-size:17px;

    outline:none;

    transition:.3s ease;
}

.form-input:focus,
.form-select:focus,
.form-message:focus{

    border-color:#a17b45;

    box-shadow:
        0 0 0 2px
        rgba(161,123,69,.08);
}

.form-message{
    min-height:120px;
    resize:vertical;
}


/* RADIO */

.radio-group{
    display:flex;

    flex-direction:column;

    gap:14px;
}

.radio-option{

    position:relative;

    display:flex;

    align-items:center;

    gap:14px;

    padding:17px 20px;

    background:
        rgba(255,250,244,.65);

    border:
        1px solid
        rgba(157,116,61,.25);

    cursor:pointer;

    transition:.3s ease;
}

.radio-option:hover{
    border-color:#b08a54;
}

.radio-option input{
    position:absolute;
    opacity:0;
}

.radio-circle{

    width:23px;
    height:23px;

    border-radius:50%;

    border:
        1px solid
        #a98a64;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.radio-circle::after{

    content:"";

    width:11px;
    height:11px;

    border-radius:50%;

    background:#a17b45;

    transform:scale(0);

    transition:.2s ease;
}

.radio-option input:checked + .radio-circle::after{
    transform:scale(1);
}

.radio-text{
    font-size:18px;
    color:#725a3c;
}


/* SUBMIT */

.rsvp-submit{

    display:block;

    width:100%;

    margin-top:10px;

    padding:18px 25px;

    background:transparent;

    border:
        1px solid
        #a17b45;

    color:#8b6739;

    font-family:'Cormorant Garamond',serif;

    font-size:13px;

    letter-spacing:3px;

    cursor:pointer;

    transition:.35s ease;
}

.rsvp-submit:hover{
    background:#9b7542;
    color:white;
}


/* SUCCESS MESSAGE */

.success-message{

    display:none;

    max-width:650px;

    margin:30px auto 0;

    padding:35px 25px;

    border:
        1px solid
        rgba(157,116,61,.3);

    background:
        rgba(255,250,244,.7);

    text-align:center;

    animation:successAppear .7s ease;
}

.success-message.show{
    display:block;
}

.success-title{

    font-family:'Great Vibes',cursive;

    font-size:48px;

    color:#956d39;

    margin-bottom:12px;
}

.success-message p{

    font-size:18px;

    line-height:1.7;

    color:#725a3c;
}

@keyframes successAppear{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:
        80px
        20px
        130px;

    text-align:center;

    background:#eadbc9;
}

.footer-names{
    font-family:'Great Vibes',c
